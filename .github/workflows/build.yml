name: HTML'den APK Üret

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.png'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Capacitor projesini oluştur
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Konum Isaretleri" "com.mesut.konumisaretleri" --web-dir www
          npx cap add android

      - name: İkonu yerleştir
        run: |
          npm install @capacitor/assets --save-dev
          mkdir -p resources
          cp icon.png resources/icon.png
          npx capacitor-assets generate --android

      - name: İzinleri ekle
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: konum-isaretleri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
