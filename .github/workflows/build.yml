name: HTML'den APK Üret

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'icon.png'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Capacitor projesini oluştur
        run: |
          mkdir www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Konum Isaretleri" "com.mesut.konumisaretleri" --web-dir www
          npx cap add android

      - name: İkonu yerleştir
        run: |
          npm install @capacitor/assets --save-dev
          mkdir -p resources
          cp icon.png resources/icon.png
          npx capacitor-assets generate --android

      - name: İzinleri ekle
        run: |
          sed -i '/<application/i\    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Kotlin çakışan sınıf düzeltmesi
        run: |
          sed -i '/allprojects {/a\    configurations.all {\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"\n        exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"\n    }' android/build.gradle
          cat android/build.gradle

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          ./gradlew assembleDebug --stacktrace > ../gradle_log.txt 2>&1
        continue-on-error: true
        id: gradle_build

      - name: Log'u kaydet (hata durumunda)
        if: steps.gradle_build.outcome == 'failure'
        run: |
          tail -c 60000 gradle_log.txt > gradle_log_tail.txt
          git config user.email "build-bot@example.com"
          git config user.name "build-bot"
          git add -f gradle_log_tail.txt
          git commit -m "build hata logu [skip ci]"
          git push

      - name: Başarısızsa iş burada durdurulur
        if: steps.gradle_build.outcome == 'failure'
        run: exit 1

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: konum-isaretleri-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release olarak yayınla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk konum-isaretleri.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" konum-isaretleri.apk \
            --title "Konum İşaretleri - build ${{ github.run_number }}" \
            --notes "Otomatik derleme"
